<!DOCTYPE html>
<html>
<head>
	<title>Exercisee 12f</title>
	<style>
		.main
		{
			display: flex;
			background-color: blueviolet;
			border:none;
			padding-bottom: 8px;
			padding-top: 8px;
			padding-left: 4px;
			padding-right: 4px;
			width: 500px;
		}

		.div1
		{
			font-weight: bold;
			color: white;
			margin-right: 75px;
			margin-left: 8px;
		}

		.txt
		{
			border: none;
			border-radius: 12px;
			padding-left: 15px;
			flex: 1;
		}

		.div2
		{
			color: white;
			border: solid;
			border-style: 1px;
			padding-bottom: 2px;
			padding-right: 8px;
			padding-left: 8px;
			padding-top: 2px;
			margin-left: 32px;
			border-radius: 8px;
		}
	</style>
</head>
<body>
	<div class="main">
		<div class="div1">Home</div>
		<input type="text" placeholder="Search" class="txt">
		<div class="div2">Download</div>
	</div>
</body>
</html>
