<!DOCTYPE html>
<html>
<head>
	<title>Exercise 8c</title>
	<style>
		div
		{
			text-align: center;
			
		}

		.logo
		{
			width: 150px;
			margin-bottom: 8px;

		}

		.txt
		{
			width: 400px;
			border-radius: 18px;
			margin-bottom: 12px;
			padding-left: 8px;
			padding-bottom: 10px;
			padding-top: 10px;
			border-color: antiquewhite;
			box-shadow: 1px 2px 4px rgba(0, 0, 0, 0.71);
			border: none;
		}

		.btn1
		{
			padding-left: 8px;
			padding-right: 8px;
			padding-bottom:8px;
			padding-top: 8px;
			margin-right: 2px;	
			color: black;
			background-color: rgb(216, 216, 216);
			border: none;
		}

		.btn2
		{
			padding-left: 8px;
			padding-right: 8px;
			padding-bottom:8px;
			padding-top: 8px;	
			margin-left: 2px;
			color: black;
			background-color: rgb(216, 216, 216);
			border: none;
		}

	</style>
</head>
<body>
	<div >
		<img class="logo" src="logo.png" alt="google_logo">
	</div>
	<div>
		<input class="txt" type="text" placeholder="Search Google or type a URL">
	</div>
	<div>
		<button class="btn1">Google Search</button>
		<button class="btn2">I'm Feeling Lucky</button>
	</div>
</body>
</html>
