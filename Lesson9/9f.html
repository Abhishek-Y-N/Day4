<!DOCTYPE html>
<html>
<head>
	<title>Exercise 9f</title>
	<style>
		.div1
		{
			width: 180px;
			margin-top: 8px;

			margin-left: 18px;
			border: none;
			border-radius: 4px;
			box-shadow: 4px 4px 4px 4px rgb(67, 67, 67);
		}

		{
			width: 180px;
			height: 150px;
			object-fit: cover;
			object-position: center;

		.p1

		.p2
		{
			color: gray;

		}

		.btn
		{
			margin-left: 4px;
			margin-bottom: 8px;
		}

</head>
<body>
	<div class="div1">
		<img src="img.jpeg" alt="image" class="image">
		<p class="p1">Oliver</p>

</html>
