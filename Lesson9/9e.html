<!DOCTYPE html>
<html>
<head>
	<title>Exercise 7g</title>
	<style>
		.div1
		{
			width: 300px;
			padding-left: 8px;
			padding-bottom: 4px;
			padding-top: 4px;
			box-shadow: 0 0 12px rgb(87, 85, 85);
			border-radius: 8px;
		}

		.image
		{
			width: 50px;
			height: 50px;
			border-radius: 200px;
			object-fit: cover;
			object-position: center;
			vertical-align: middle;
		}

		.txt
		{
			color: rgb(140, 138, 138);
			border: none;
			vertical-align: middle;
		}

		.btn
		{
			color: white;
			background-color: rgb(82, 168, 248);
			font-weight: bold;
			padding-bottom: 10px;
			padding-top: 10px;
			padding-left: 14px;
			padding-right: 14px;
			border: none;
			border-radius: 18px;
			vertical-align: middle;
		}
	</style>
</head>
<body>
	<div class="div1">
		<img src="img.jpeg" alt="image" class="image">
	    <input type="text" placeholder="What's Happening?" class="txt">
	    <button class="btn">Tweet</button>
	</div>
</body>
</html>
