<!DOCTYPE html>
<html>
<head>
	<title>Exercise 9g</title>
	<style>
		.div1
		{
			width: 180px;
			margin-top: 8px;
			margin-bottom: 8px;
			margin-left: 18px;
			border: none;
			border-radius: 4px;
			box-shadow: 4px 4px 4px 4px rgb(82, 82, 82);
			display: inline-block;
		}
		
		.image 
		{
			width: 180px;
			height: 150px;
			object-fit: cover;
			object-position: center;
		}

		.p1
		{
			font-family: Arial;
			font-size: 18px;
			font-weight: bold;
			margin-top: 0;
			margin-bottom: 0;
			padding-left: 4px;
		}

		.p2
		{
			color: gray;
			font-family: Arial;
			font-size: 12px;
			margin-top: 2px;
			margin-bottom: 8px;
			padding-left: 4px;
		}

		.btn
		{
			margin-left: 4px;
			margin-bottom: 8px;
			background-color: rgb(38, 160, 236);
			color: white;
			padding-left: 8px;
			padding-right: 8px;
			padding-top: 4px;
			padding-bottom: 4px;
			border: none;
			border-radius: 4px;
		}
	</style>
</head>
<body>
	<div class="div1">
		<img src="img.jpeg" alt="image" class="image">
		<p class="p1">Oliver</p>
		<p class="p2">2 mutual friends</p>
		<button class="btn">Add Friend</button>
	</div>

	<div class="div1">
		<img src="img2.jpeg" alt="image" class="image">
		<p class="p1">Mimi</p>
		<p class="p2">3 mutual friends</p>
		<button class="btn">Add Friend</button>
	</div>

	<div class="div1">
		<img src="img3.jpeg" alt="image" class="image">
		<p class="p1">Rex</p>
		<p class="p2">4 mutual friends</p>
		<button class="btn">Add Friend</button>
	</div>
</body>
</html>
