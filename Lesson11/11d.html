<!DOCTYPE html>
<html>
<head>
	<title>Exercise 11d</title>
	<style>

		.main
		{
			display: grid;
			grid-template-columns: 200px 200px 200px;
			column-gap: 15px;
		}
		.card 
		{
            display: grid;
            width: 200px;
            margin-right: 15px;
            vertical-align: top;
            box-shadow: 0px 0px 5px gray;
        }

        .card-image 
		{
            width: 200px;
            height: 200px;
            object-fit: cover;
        }

        .card-info
		 {
            padding: 10px;
        }

        .name 
		{
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .friends 
		{
            color: gray;
            margin-bottom: 10px;
        }

        .friends img 
		{
            width: 25px;
            height: 25px;
            border-radius: 50%;
            vertical-align: middle;
        }

        button 
		{
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
        }
	</style>
</head>
<body>
	<div class="main">
		<div class="card">
			<img class="card-image" src="img3.jpeg">
			<div class="card-info">
				<div class="name">
					Oliver
				</div>
				<div class="friends">
					<img src="img3.jpeg">
					2 mutual friends
				</div>
				<button>Add Friend</button>
			</div>
		</div>


		<div class="card">
			<img class="card-image" src="img.jpeg">
			<div class="card-info">
				<div class="name">
					Mimi
				</div>
				<div class="friends">
					<img src="img3.jpeg">
					3 mutual friends
				</div>
				<button>Add Friend</button>
			</div>
		</div>


		<div class="card">
			<img class="card-image" src="img2.jpeg">
			<div class="card-info">
				<div class="name">
					Rex
				</div>
				<div class="friends">
					<img src="img3.jpeg">
					4 mutual friends
				</div>
				<button>Add Friend</button>
			</div>
		</div>
	</div>
</body>
</html>
